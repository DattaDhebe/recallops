[project]
name = "recallops"
version = "0.1.0"
description = "An incident-response agent with CockroachDB vector memory, Managed MCP auditing, and Amazon Bedrock reasoning."
readme = "PACKAGE.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0,<1",
  "mcp>=1.24,<2",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.urls]
Source = "https://github.com/DattaDhebe/recallops"
Issues = "https://github.com/DattaDhebe/recallops/issues"
Documentation = "https://github.com/DattaDhebe/recallops#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]
