name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DATABASE_URL: sqlite:///./ci.db
      USE_BEDROCK: "false"
      REQUIRE_COCKROACHDB: "false"
      USE_COCKROACH_MCP: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install "build>=1,<2" "twine>=6,<7"
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/recallops-wheel"
          "$RUNNER_TEMP/recallops-wheel/bin/python" -m pip install dist/*.whl

      - name: Smoke test installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/recallops-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"
