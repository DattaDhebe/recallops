<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RecallOps architecture</title>
  <desc id="desc">RecallOps stores incident evidence and embeddings in CockroachDB, recalls resolved incidents through distributed vector indexing, audits the top memory through CockroachDB Cloud Managed MCP, and uses Amazon Bedrock for embeddings and grounded summaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#101b43"/>
      <stop offset="1" stop-color="#082b38"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" x2="1">
      <stop offset="0" stop-color="#6f78ff"/>
      <stop offset="1" stop-color="#20d7c2"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" x2="1">
      <stop offset="0" stop-color="#2f49a5"/>
      <stop offset="1" stop-color="#0f7d85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66e4d5"/>
    </marker>
    <style>
      .title { font: 800 52px Inter,Segoe UI,sans-serif; fill: #f8fbff; letter-spacing: -1px; }
      .subtitle { font: 400 21px Inter,Segoe UI,sans-serif; fill: #aabbe4; }
      .eyebrow { font: 700 15px Inter,Segoe UI,sans-serif; fill: #7ef2e5; letter-spacing: 2px; }
      .box-title { font: 700 24px Inter,Segoe UI,sans-serif; fill: #fff; }
      .box-copy { font: 400 16px Inter,Segoe UI,sans-serif; fill: #c8d5f1; }
      .chip { font: 700 13px Inter,Segoe UI,sans-serif; fill: #e8edff; letter-spacing: .5px; }
      .step { font: 800 17px Inter,Segoe UI,sans-serif; fill: #081426; }
      .label { font: 600 14px Inter,Segoe UI,sans-serif; fill: #9db0d8; }
      .arrow { stroke: #66e4d5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #ffb45b; stroke-width: 3; fill: none; stroke-dasharray: 10 10; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="220" fill="#18c9b7" opacity="0.06"/>
  <circle cx="90" cy="820" r="260" fill="#6b67ff" opacity="0.07"/>

  <text class="eyebrow" x="80" y="72">AGENTIC INCIDENT MEMORY</text>
  <text class="title" x="80" y="130">How RecallOps turns every resolution into reusable evidence</text>
  <text class="subtitle" x="80" y="170">Target runtime: AWS ECS Fargate | Persistent memory: CockroachDB Cloud | Reasoning: Amazon Bedrock</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="300" height="390" rx="28" fill="#111a38" stroke="#344875" stroke-width="2"/>
    <circle cx="130" cy="305" r="23" fill="#ffb45b"/>
    <text class="step" x="124" y="312">1</text>
    <text class="box-title" x="170" y="313">Operator console</text>
    <text class="box-copy" x="110" y="365">Record an incident with:</text>
    <text class="box-copy" x="125" y="402">- service + symptoms</text>
    <text class="box-copy" x="125" y="435">- infrastructure context</text>
    <text class="label" x="110" y="478">Then capture resolution + outcome</text>
    <rect x="110" y="510" width="240" height="82" rx="16" fill="#17264d" stroke="#ffb45b" stroke-width="2"/>
    <text class="chip" x="134" y="550">HUMAN APPROVAL GATE</text>
    <text class="box-copy" x="134" y="575">Operator approval required</text>
  </g>

  <path class="arrow" d="M 380 445 C 405 445, 420 445, 448 445"/>
  <path class="arrow" d="M 485 588 C 430 585, 395 550, 350 520"/>

  <g filter="url(#shadow)">
    <rect x="450" y="230" width="300" height="430" rx="28" fill="url(#agent)" opacity="0.96"/>
    <circle cx="500" cy="290" r="23" fill="#f8fbff"/>
    <text class="step" x="494" y="297">2</text>
    <text class="box-title" x="540" y="298">RecallOps agent</text>
    <text class="box-copy" x="485" y="355" fill="#ecf6ff">FastAPI orchestration</text>
    <rect x="485" y="388" width="230" height="62" rx="15" fill="#101d4e" opacity="0.75"/>
    <text class="chip" x="510" y="414">ATOMIC MEMORY WRITE</text>
    <text class="box-copy" x="510" y="437">Incident + evidence commit</text>
    <rect x="485" y="470" width="230" height="62" rx="15" fill="#101d4e" opacity="0.75"/>
    <text class="chip" x="510" y="496">RESOLVED-ONLY RECALL</text>
    <text class="box-copy" x="510" y="519">Same service - thresholded</text>
    <rect x="485" y="552" width="230" height="72" rx="15" fill="#101d4e" opacity="0.75"/>
    <text class="chip" x="510" y="578">GROUNDED RESPONSE</text>
    <text class="box-copy" x="510" y="601">Evidence IDs + uncertainty</text>
  </g>

  <path class="arrow" d="M 750 360 C 815 330, 825 330, 880 330"/>
  <path class="arrow" d="M 750 525 C 815 555, 825 555, 880 555"/>

  <g filter="url(#shadow)">
    <rect x="880" y="215" width="640" height="270" rx="28" fill="url(#memory)" stroke="#5c72d9" stroke-width="2"/>
    <circle cx="930" cy="272" r="23" fill="#7ef2e5"/>
    <text class="step" x="924" y="279">3</text>
    <text class="box-title" x="970" y="280">CockroachDB Cloud - durable agent memory</text>
    <rect x="920" y="325" width="170" height="105" rx="18" fill="#0b1736" opacity="0.82"/>
    <text class="chip" x="945" y="357">INCIDENTS</text>
    <text class="box-copy" x="945" y="385">state - service</text>
    <text class="box-copy" x="945" y="410">infrastructure</text>
    <rect x="1110" y="325" width="180" height="105" rx="18" fill="#0b1736" opacity="0.82"/>
    <text class="chip" x="1135" y="357">MEMORY EVENTS</text>
    <text class="box-copy" x="1135" y="385">symptom - resolution</text>
    <text class="box-copy" x="1135" y="410">outcome - provenance</text>
    <rect x="1310" y="325" width="170" height="105" rx="18" fill="#0b1736" opacity="0.82"/>
    <text class="chip" x="1335" y="357">VECTOR(512)</text>
    <text class="box-copy" x="1335" y="385">distributed ANN</text>
    <text class="box-copy" x="1335" y="410">cosine + prefix</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="515" width="305" height="190" rx="28" fill="#171943" stroke="#7675ff" stroke-width="2"/>
    <circle cx="930" cy="570" r="23" fill="#a8a4ff"/>
    <text class="step" x="924" y="577">4</text>
    <text class="box-title" x="970" y="578">Managed MCP</text>
    <text class="box-copy" x="920" y="625">Read-only, cluster-scoped</text>
    <text class="box-copy" x="920" y="652">select_query audits the top</text>
    <text class="box-copy" x="920" y="679">memory trail before display.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1215" y="515" width="305" height="190" rx="28" fill="#3a203c" stroke="#ffb45b" stroke-width="2"/>
    <circle cx="1265" cy="570" r="23" fill="#ffcc84"/>
    <text class="step" x="1259" y="577">5</text>
    <text class="box-title" x="1305" y="578">Amazon Bedrock</text>
    <text class="box-copy" x="1255" y="625">Titan creates embeddings.</text>
    <text class="box-copy" x="1255" y="652">Nova summarizes recalled</text>
    <text class="box-copy" x="1255" y="679">evidence with guardrails.</text>
  </g>

  <path class="feedback" d="M 1370 705 C 1370 805, 690 820, 600 660"/>
  <text class="label" x="840" y="872">Recorded resolution + outcome close the feedback loop for the next incident</text>

  <rect x="80" y="748" width="660" height="102" rx="20" fill="#0d1630" stroke="#2b3b68"/>
  <text class="chip" x="110" y="780">VISIBLE PROOF IN EVERY RESPONSE</text>
  <text class="box-copy" x="110" y="808">relevance - matched terms - resolution - recorded outcome</text>
  <text class="box-copy" x="110" y="833">memory IDs - source IDs - timestamps - MCP status</text>
</svg>
